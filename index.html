<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>机电青协 · 部门盲盒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#FFF5EB 0%,#FFE8D6 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 16px 40px;
}
.header{text-align:center;margin-bottom:24px}
.header .logo{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;border-radius:20px;padding:6px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;
  font-size:14px;color:#666;
}
.header .logo .heart{color:#FF6B6B}
.header h1{font-size:28px;color:#333;margin-bottom:8px;font-weight:700}
.header p{font-size:15px;color:#888}

.wheel-container{
  position:relative;
  width:min(340px,90vw);
  height:min(340px,90vw);
  margin:10px 0 30px;
}
.pointer{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  z-index:10;
  width:0;height:0;
  border-left:16px solid transparent;
  border-right:16px solid transparent;
  border-top:30px solid #FF4757;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
}
.pointer::after{
  content:'';position:absolute;top:-36px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;background:#FF4757;
  border:3px solid #fff;
}
#wheel{
  width:100%;height:100%;
  border-radius:50%;
  transition:transform 4.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  box-shadow:0 8px 30px rgba(0,0,0,.12), inset 0 0 0 6px #fff;
}
.center-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:70px;height:70px;border-radius:50%;
  background:linear-gradient(135deg,#FF8C42,#FF6B35);
  color:#fff;border:none;font-size:18px;font-weight:700;
  box-shadow:0 4px 15px rgba(255,107,53,.4), inset 0 0 0 4px #fff;
  cursor:pointer;z-index:5;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.center-btn:active{transform:translate(-50%,-50%) scale(.95)}
.center-btn:disabled{opacity:.7;cursor:not-allowed}

.tip{
  text-align:center;color:#999;font-size:13px;margin-top:-10px;margin-bottom:20px;
}

/* 弹窗 */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
  animation:fadeIn .3s ease;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:20px;
  width:100%;max-width:360px;
  max-height:85vh;overflow-y:auto;
  animation:slideUp .4s cubic-bezier(.16,1,.3,1);
  position:relative;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.modal-header{
  padding:28px 24px 20px;
  text-align:center;
  border-radius:20px 20px 0 0;
  color:#fff;
  position:relative;
}
.modal-header .dept-icon{
  font-size:40px;margin-bottom:8px;
}
.modal-header h2{font-size:22px;font-weight:700;margin-bottom:6px}
.modal-header .dept-desc{font-size:14px;opacity:.9;line-height:1.5}

.modal-body{padding:20px 24px}
.modal-body .question{
  text-align:center;font-size:16px;color:#333;
  margin-bottom:16px;font-weight:600;
}

.detail-tabs{
  display:flex;gap:8px;margin-bottom:16px;
}
.tab-btn{
  flex:1;padding:10px 4px;
  border:2px solid #f0f0f0;border-radius:12px;
  background:#fff;font-size:12px;color:#666;
  cursor:pointer;transition:all .2s;
  font-weight:500;
}
.tab-btn.active{
  border-color:var(--dept-color,#FF6B35);
  color:var(--dept-color,#FF6B35);
  background:var(--dept-bg,#FFF5EB);
}
.tab-content{
  background:#f8f9fa;border-radius:12px;
  padding:16px;font-size:14px;line-height:1.8;
  color:#444;min-height:100px;
  animation:fadeIn .25s ease;
}
.tab-content ul{padding-left:18px;margin:0}
.tab-content li{margin-bottom:6px}
.tab-content li:last-child{margin-bottom:0}

.modal-actions{
  padding:0 24px 24px;
  display:flex;gap:12px;
}
.btn{
  flex:1;padding:14px;border-radius:12px;
  border:none;font-size:15px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-primary{
  background:var(--dept-color,#FF6B35);
  color:#fff;
  box-shadow:0 4px 12px rgba(255,107,53,.3);
}
.btn-secondary{
  background:#f5f5f5;color:#666;
}
.btn:active{transform:scale(.97)}

.back-btn{
  display:block;width:100%;padding:12px;
  border:none;background:transparent;
  color:#999;font-size:13px;cursor:pointer;
  margin-top:8px;
}

/* 滚动条美化 */
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="heart">❤</span> 机电工程学院青年志愿者协会</div>
  <h1>🎡 部门盲盒</h1>
  <p>转动转盘，遇见你的志愿部门</p>
</div>

<div class="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel"></canvas>
  <button class="center-btn" id="spinBtn">开始</button>
</div>

<p class="tip">点击中心按钮转动转盘</p>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header" id="modalHeader">
      <div class="dept-icon" id="deptIcon">🎁</div>
      <h2 id="deptName">部门名称</h2>
      <div class="dept-desc" id="deptDesc">部门简介</div>
    </div>
    <div class="modal-body">
      <div class="question" id="questionText">你想加入我们吗？</div>
      
      <div class="detail-tabs" id="detailTabs" style="display:none">
        <button class="tab-btn" data-tab="do">我们做什么</button>
        <button class="tab-btn" data-tab="gain">你能收获什么</button>
        <button class="tab-btn" data-tab="need">我们需要什么</button>
      </div>
      <div class="tab-content" id="tabContent" style="display:none"></div>
    </div>
    <div class="modal-actions" id="mainActions">
      <button class="btn btn-secondary" id="noBtn">再转一次</button>
      <button class="btn btn-primary" id="yesBtn">想了解更多</button>
    </div>
    <div style="padding:0 24px 16px">
      <button class="back-btn" id="backBtn" style="display:none">← 返回转盘</button>
    </div>
  </div>
</div>

<script>
// 部门数据
const departments = [
  {
    name: "青联部",
    icon: "📋",
    color: "#FF6B6B",
    bgColor: "#FFF0F0",
    desc: "志愿活动策划与举办的\"总设计师\"",
    do: [
      "负责校级活动的策划、组织与举办（写策划案，与协办学院及时沟通）",
      "跨学院志愿活动的协办",
      "各个部门间的联络沟通",
      "活动前期的宣传（公众号、食宣）",
      "活动实时跟进并与志愿者保持沟通"
    ],
    gain: [
      "活动策划能力",
      "统筹管理能力",
      "参加更多校级、院级志愿活动的机会",
      "认识志同道合的伙伴"
    ],
    need: [
      "对志愿活动有热情、有想法、脑洞大的小伙伴",
      "零基础也可以，手把手教"
    ]
  },
  {
    name: "青务部",
    icon: "📁",
    color: "#4ECDC4",
    bgColor: "#E8FAF8",
    desc: "青协的\"幕后管家\"，文件与公务处理专家",
    do: [
      "对接青协各类文件、规范格式",
      "整理周报、月报、简报",
      "工作时间地点自由，不需要去活动现场（想去也可以）"
    ],
    gain: [
      "办公软件技能",
      "赢在起跑线的职场经验",
      "居家办公式轻松体验",
      "认识志同道合的伙伴"
    ],
    need: [
      "做事细心、对青协感兴趣",
      "喜欢安静处理事务的小伙伴（i人友好）"
    ]
  },
  {
    name: "青翼部",
    icon: "🕊️",
    color: "#A29BFE",
    bgColor: "#F3F0FF",
    desc: "班级团支部志愿活动的\"组织者\"，时长整理与审核的\"把关人\"",
    do: [
      "轮值负责大一至大三各班级志愿活动组织",
      "大轮胎环保行动（青翼独家特色）",
      "与各班级团支书合作定制多彩活动",
      "志愿时长收集、审核、认定与申诉处理"
    ],
    gain: [
      "组织管理经验",
      "领导力提升",
      "更多参与志愿活动的机会",
      "数据处理能力"
    ],
    need: [
      "有责任心、做事认真",
      "对班级志愿感兴趣的同学"
    ]
  },
  {
    name: "青行部",
    icon: "🚀",
    color: "#FD79A8",
    bgColor: "#FFF0F6",
    desc: "校外志愿的\"先锋队\"，社会实践的\"行动派\"",
    do: [
      "策划和组织社会调研",
      "开展各类公益服务活动",
      "对接徐州音乐厅、永康社区、康汇敬老院、启聪孤儿院、彭祖园等校外实践基地",
      "实施社会实践项目"
    ],
    gain: [
      "丰富的校外实践经历",
      "社会责任感",
      "一边看演出一边完成志愿活动",
      "人际交往能力"
    ],
    need: [
      "热爱校外实践、有公益热情",
      "愿意走出校园的同学"
    ]
  },
  {
    name: "青宣部",
    icon: "🎨",
    color: "#FDCB6E",
    bgColor: "#FFF8E7",
    desc: "青协的\"门面担当\"，用创意记录温暖瞬间",
    do: [
      "青协整体形象设计与宣传工作",
      "活动前期海报制作",
      "扫楼宣传、食宣",
      "活动现场摄影记录",
      "活动后勤支持",
      "院级志愿活动的举办",
      "活动后期的新闻撰写"
    ],
    gain: [
      "设计软件技能",
      "摄影修图能力",
      "新媒体运营经验",
      "超多小礼品和零食团建"
    ],
    need: [
      "对宣传设计感兴趣、有丰富活动想法创意",
      "想体验丰富大学生活的同学",
      "零基础包教包会"
    ]
  }
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const modal = document.getElementById('modal');
const modalHeader = document.getElementById('modalHeader');
const deptIcon = document.getElementById('deptIcon');
const deptName = document.getElementById('deptName');
const deptDesc = document.getElementById('deptDesc');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const backBtn = document.getElementById('backBtn');
const detailTabs = document.getElementById('detailTabs');
const tabContent = document.getElementById('tabContent');
const questionText = document.getElementById('questionText');
const mainActions = document.getElementById('mainActions');

const size = Math.min(340, window.innerWidth * 0.9);
canvas.width = size * 2;
canvas.height = size * 2;
canvas.style.width = size + 'px';
canvas.style.height = size + 'px';
ctx.scale(2, 2);

const R = size / 2;
const segAngle = 360 / departments.length;
let currentAngle = 0;
let isSpinning = false;
let currentDept = null;

// 绘制转盘
function drawWheel() {
  ctx.clearRect(0, 0, size, size);
  const cx = R, cy = R;
  
  departments.forEach((dept, i) => {
    const startAngle = (i * segAngle - 90 - segAngle / 2) * Math.PI / 180;
    const endAngle = ((i + 1) * segAngle - 90 - segAngle / 2) * Math.PI / 180;
    
    // 扇区
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R - 3, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = dept.color;
    ctx.fill();
    
    // 分隔线
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R - 3, startAngle, startAngle);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 文字 - 竖排，白色粗体，从圆心向圆周排列
    // 统一方向：所有扇区文字都从圆心向圆周竖排，每个字正立
    // 这样当扇区转到顶部时，文字自然就是从上到下正立可读的
    ctx.save();
    ctx.translate(cx, cy);
    
    // 计算文字旋转角度
    const textAngle = i * segAngle;
    ctx.rotate(textAngle * Math.PI / 180);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // 文字阴影增加可读性
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    
    const chars = dept.name.split('');
    const charSpacing = 32;
    const startY = -R * 0.5; // 从靠近圆心约一半位置开始
    
    chars.forEach((char, ci) => {
      const y = startY + ci * charSpacing;
      ctx.fillText(char, 0, y);
    });
    
    ctx.restore();
  });
  
  // 中心圆装饰
  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

drawWheel();

// 旋转转盘
function spin() {
  if (isSpinning) return;
  isSpinning = true;
  spinBtn.disabled = true;
  
  // 随机选中一个部门（均等概率）
  const targetIndex = Math.floor(Math.random() * departments.length);
  
  // 计算旋转角度：转5-7圈 + 对准目标部门
  // 扇区i中心初始角度：i * segAngle - 90（顶部为-90度）
  // 旋转后要让目标部门对准顶部（-90度），则最终角度%360应等于 (360 - targetIndex * segAngle) % 360
  const spins = 5 + Math.floor(Math.random() * 3);
  const targetMod = (360 - targetIndex * segAngle) % 360;
  const currentMod = currentAngle % 360;
  let delta = targetMod - currentMod;
  if (delta < 0) delta += 360;
  const rotateAmount = spins * 360 + delta;
  
  currentAngle += rotateAmount;
  canvas.style.transform = `rotate(${currentAngle}deg)`;
  
  setTimeout(() => {
    isSpinning = false;
    spinBtn.disabled = false;
    currentDept = departments[targetIndex];
    showModal(currentDept);
  }, 4600);
}

// 显示弹窗
function showModal(dept) {
  deptIcon.textContent = dept.icon;
  deptName.textContent = dept.name;
  deptDesc.textContent = dept.desc;
  
  modalHeader.style.background = dept.color;
  document.documentElement.style.setProperty('--dept-color', dept.color);
  document.documentElement.style.setProperty('--dept-bg', dept.bgColor);
  
  // 重置状态
  questionText.textContent = '你想加入我们吗？';
  questionText.style.display = 'block';
  detailTabs.style.display = 'none';
  tabContent.style.display = 'none';
  mainActions.style.display = 'flex';
  backBtn.style.display = 'none';
  
  // 重置tab
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  modal.classList.add('show');
}

// 关闭弹窗
function closeModal() {
  modal.classList.remove('show');
}

// 显示详情
function showDetail() {
  questionText.style.display = 'none';
  detailTabs.style.display = 'flex';
  tabContent.style.display = 'block';
  mainActions.style.display = 'none';
  backBtn.style.display = 'block';
  
  // 默认选中第一个tab
  const firstTab = document.querySelector('.tab-btn');
  switchTab('do');
}

// 切换tab
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  
  let content = '';
  if (tab === 'do') {
    content = '<ul>' + currentDept.do.map(item => `<li>${item}</li>`).join('') + '</ul>';
  } else if (tab === 'gain') {
    content = '<ul>' + currentDept.gain.map(item => `<li>${item}</li>`).join('') + '</ul>';
  } else if (tab === 'need') {
    content = '<ul>' + currentDept.need.map(item => `<li>${item}</li>`).join('') + '</ul>';
  }
  tabContent.innerHTML = content;
}

// 事件绑定
spinBtn.addEventListener('click', spin);
noBtn.addEventListener('click', closeModal);
yesBtn.addEventListener('click', showDetail);
backBtn.addEventListener('click', closeModal);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// 点击遮罩关闭
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});
</script>
</body>
</html>
